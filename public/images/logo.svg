<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title">
  <title id="title">Ícone abstrato em preto, cinza aço e amarelo</title>
  <defs>
    <linearGradient id="blackTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202327"/>
      <stop offset="1" stop-color="#111315"/>
    </linearGradient>
    <linearGradient id="steelFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aeb3ba"/>
      <stop offset="1" stop-color="#6f757d"/>
    </linearGradient>
    <linearGradient id="steelTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3c7cc"/>
      <stop offset="1" stop-color="#858b93"/>
    </linearGradient>
    <linearGradient id="yellowFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc817"/>
      <stop offset="1" stop-color="#f6a900"/>
    </linearGradient>
    <linearGradient id="yellowTop" x1="0.15" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#ffcf24"/>
      <stop offset="1" stop-color="#ffad00"/>
    </linearGradient>
  </defs>

  <g stroke="#080a0c" stroke-width="13" stroke-linejoin="miter" stroke-linecap="square">
    <!-- Top face: dark graphite -->
    <path fill="url(#blackTop)" d="M500 230 699 345 500 460 301 345Z"/>

    <!-- Left face: steel gray -->
    <path fill="url(#steelFace)" d="M301 345 500 460 500 690 301 575Z"/>
    <!-- Small foot plate extending from the left face's base -->
    <path fill="url(#steelTop)" d="M301 575 500 690 402 748 203 633Z"/>

    <!-- Right face: industrial yellow -->
    <path fill="url(#yellowFace)" d="M500 460 699 345 699 575 500 690Z"/>
    <!-- Folded flap echoing the right face, hinged along its outer edge -->
    <path fill="url(#yellowTop)" d="M699 345 785 395 785 625 699 575Z"/>
  </g>
</svg>
